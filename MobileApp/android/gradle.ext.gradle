/**
 * Gradle Extension Configuration
 * Centralized configuration for all Android build settings
 */

ext {
    // Android SDK Versions
    minSdkVersion = 21
    compileSdkVersion = 34
    targetSdkVersion = 34
    buildToolsVersion = "34.0.0"
    ndkVersion = "27.0.11518014"

    // Language versions - MUST be Java 11 for React Native 0.72.17
    kotlinVersion = "1.8.10"
    javaVersion = JavaVersion.VERSION_11
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11

    // React Native and dependencies
    reactNativeVersion = "0.72.17"
    hermesVersion = "0.72.1"

    // Support libraries
    androidxCoreVersion = "1.6.0"
    androidxAppCompatVersion = "1.3.1"
    androidxConstraintLayoutVersion = "2.1.3"
    androidxRecyclerViewVersion = "1.2.1"

    // Testing
    junitVersion = "4.13.2"
    testRunnerVersion = "1.4.0"
    espressoCoreVersion = "3.4.0"

    // Build flags
    enableNewArchitecture = false
    enableHermes = true
    enablePngCrunch = true
    enableMinifyInRelease = false
    enableShrinkResources = false
    enableLegacyPackaging = false

    // Gradle daemon settings
    org_gradle_jvmargs = "-Xmx2048m -XX:MaxMetaspaceSize=512m"
    org_gradle_parallel = true
    org_gradle_workers_max = (Runtime.getRuntime().availableProcessors() as Integer) - 1
}
