
[req]
default_bits = 2048
prompt = no
default_md = sha256
distinguished_name = dn
req_extensions = v3_req

[dn]
C = ID
ST = Jakarta
L = Jakarta
O = GIS Connect
OU = IT Department
CN = server.gisconnect.online
emailAddress = admin@gisconnect.online

[v3_req]
keyUsage = keyEncipherment, dataEncipherment
extendedKeyUsage = serverAuth
subjectAltName = @alt_names

[alt_names]
DNS.1 = server.gisconnect.online
DNS.2 = *.server.gisconnect.online
DNS.3 = localhost
IP.1 = 127.0.0.1
IP.2 = ::1