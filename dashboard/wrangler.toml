# Cloudflare Pages Configuration
name = "gisconnect-dashboard"
compatibility_date = "2024-01-01"

[env.production]
vars = { ENVIRONMENT = "production" }

[env.staging]
vars = { ENVIRONMENT = "staging" }

# Build configuration
[build]
command = "npm run build"
publish = "dist"

# Redirects for SPA
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Headers for security
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.gisconnect.online wss://server.gisconnect.online"

# API proxy
[[routes]]
pattern = "api/*"
custom_domain = true

[env.production.routes]
pattern = "api/*"
custom_domain = "api.gisconnect.online"
