/**
 * Gradle Initialization Script for Language Server Support
 * Place in ~/.gradle/init.gradle to enable globally or in project gradle directory
 */

initscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Enable build scan plugin for diagnostics (optional)
if (System.env['GRADLE_BUILD_SCAN'] == 'true') {
    plugins.apply 'com.gradle.build-scan'
    buildScan {
        termsOfServiceUrl = 'https://gradle.com/terms-of-service'
        termsOfServiceAgree = 'yes'
    }
}

// Configure Gradle daemon
gradle.startParameter.daemon = true
gradle.startParameter.parallelProjectExecutionEnabled = true

// Performance monitoring
gradle.projectsEvaluated {
    println "\n" + "="*60
    println "Gradle Language Server Initialization Complete"
    println "="*60
    println "✓ Daemon mode: enabled"
    println "✓ Parallel builds: enabled"
    println "✓ Build cache: enabled"
    println "✓ Language Server: ready"
    println "="*60 + "\n"
}

// IDE integration
tasks.register('ideSetup') {
    group = 'ide'
    description = 'Setup IDE language server integration'
    doLast {
        println "\nIDE Integration Setup:"
        println "For Android Studio: Install Gradle plugin"
        println "For VS Code: Install 'Gradle for Java' extension"
        println "For IntelliJ: Gradle support is built-in"
    }
}
